<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <title>Contador de Água</title>
        <link rel="stylesheet" href="./CSS/style.css" />
    </head>
    <body>
        <header></header>
        <main>
            <div id="configuracao">
                <h2>Configuração</h2>
                <label>Peso (kg): <input type="number" id="peso" /></label>
                <span id="erro-peso"></span>
                <label>Tamanho do copo (ml): <input type="number" id="tamanho-copo" /></label>
                <span id="erro-copo"></span>
                <button id="btn-salvar" disabled>Salvar</button>
            </div>
            <div id="contador">
                <p id="texto-copos"></p>
                <p id="texto-ml"></p>
                <button id="btn-menos-um">-1</button>
                <button id="btn-menos-meio">-½</button>
                <button id="btn-mais-meio">+½</button>
                <button id="btn-mais-um">+1</button>
                <span id="barra-progresso">
                    <span id="barra-preenchida"></span>
                </span>
                <p id="mensagem-meta"></p>
                <button id="btn-reset">Resetar dia</button>
                <button id="btn-reset-geral">Resetar valores</button>
            </div>
        </main>
        <div id="modal-reset">
            <p>Tem certeza disso?</p>
            <button id="btn-confirmar-reset">Sim</button>
            <button id="btn-cancelar-reset">Não</button>
        </div>
        <footer></footer>
        <script src="./JS/core.js"></script>
        <script src="./JS/storage.js"></script>
        <script src="./JS/app.js"></script>
    </body>
</html>
